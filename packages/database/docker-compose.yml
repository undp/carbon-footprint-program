version: "3.9"

services:
  postgres:
    # pgvector image (Debian-based, not alpine): the chatbot corpus needs the
    # `vector` extension for embedding similarity search, and the official
    # postgres image does not ship it. Digest-pinned for reproducibility; bump
    # the tag and digest together.
    image: pgvector/pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
    container_name: undp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
    driver: local
