name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Minimal default token scope for every job (jobs override as needed). Reading
# the repository is all the build/test jobs require.
permissions:
  contents: read

jobs:
  check-draft:
    name: Check Draft
    runs-on: ubuntu-latest
    permissions: {}
    if: github.event.pull_request.draft == false
    steps:
      - run: echo "Not a draft, proceeding"

  # Detect whether code/config (as opposed to docs-only) changed, so the heavy
  # jobs (lint, type-check, test, build) can no-op on docs-only PRs.
  #
  # DEADLOCK-SAFE PATTERN: those jobs still RUN and report their (required)
  # status check on every PR — they only skip their expensive *steps* when
  # `code == 'false'`. We deliberately avoid `on.paths` / `paths-ignore` and a
  # job-level `if:`, because a required check that never reports would leave the
  # PR "pending" forever under branch protection. An always-running job that
  # executes zero steps still reports success.
  changes:
    needs: check-draft
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          # `code` is true if anything that can affect lint/types/tests/build
          # changed. Intentionally broad (errs toward running): a docs edit under
          # apps/** would still run the heavy jobs, but a pure docs/**-or-*.md PR
          # skips them.
          #
          # KEEP IN SYNC: this list is a second source of truth for "what affects
          # the build". Any new root/tooling config that influences install,
          # lint, type-check, test or build MUST be added here, or a change to it
          # would be misclassified as docs-only and skip the heavy jobs. The
          # `verify-changes-filter` job (scripts/check-ci-changes-filter.mjs)
          # enforces this list and its expected behaviour.
          #
          # Deliberately excluded: format-only config (.prettierrc,
          # .prettierignore) — the `format` job is ungated and always runs; and
          # .tool-versions — CI derives Node from .nvmrc and pnpm from the
          # package.json `packageManager` field, not from .tool-versions.
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'tools/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'patches/**'
              - 'turbo.json'
              - '.nvmrc'
              - '**/package.json'
              - '**/tsconfig*.json'
              - '.github/workflows/ci.yml'

  # Guards the `code` filter above against drift: fails if the pattern list is
  # narrowed unexpectedly or if a representative path is misclassified. Runs on
  # every PR (cheap, no install — plain Node), so a change to ci.yml is
  # self-validating. See scripts/check-ci-changes-filter.mjs.
  verify-changes-filter:
    needs: check-draft
    name: Verify changes filter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/check-ci-changes-filter.mjs

  lint:
    needs: [check-draft, changes]
    name: Lint
    runs-on: ubuntu-latest
    # Every step gated on `code`, so this is a fast no-op success on docs-only
    # PRs while still reporting the required "Lint" check.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.code == 'true'
      - run: pnpm lint
        if: needs.changes.outputs.code == 'true'

  type-check:
    needs: [check-draft, changes]
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.code == 'true'
      - run: pnpm type-check
        if: needs.changes.outputs.code == 'true'

  format:
    needs: check-draft
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  # Fast unit tests for the seed tool (tools/seed) — no database or
  # testcontainers, so it stays out of the heavy `test` matrix and its coverage
  # gate. Gated on `code` like the other heavy jobs so docs-only PRs no-op while
  # still reporting this check. `test:seed` runs via turbo, which builds the
  # workspace deps (`^build`) the tests import at runtime.
  seed-test:
    needs: [check-draft, changes]
    name: Seed Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.code == 'true'
      - run: pnpm test:seed
        if: needs.changes.outputs.code == 'true'

  test:
    needs: [check-draft, changes]
    name: Test (${{ matrix.leg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Three legs that partition the suite into disjoint sets (check names
        # `Test (base)`, `Test (storage-azure)`, `Test (storage-minio)` are
        # required under branch protection):
        #   - base:          the full suite EXCEPT the storage manifest — the
        #                     bulk, run once.
        #   - storage-azure: the storage manifest against Azurite.
        #   - storage-minio: the storage manifest against MinIO.
        # `leg` is the Vitest project name in apps/api/vitest.config.ts
        # (test.projects); base ∪ storage-* == full suite. The storage manifest
        # is the single source of truth for both the base `exclude` and the
        # storage `include`. Each project selects its provider (and the
        # matching STORAGE_PROVIDER in its test.env) from its name in
        # globalSetup.ts — no env is needed here.
        leg: [base, storage-azure, storage-minio]
    # The storage legs are quick (18 files each); the base leg is the long pole.
    # Gating every step is where docs-only PRs save the most. All three legs
    # still report their required "Test (...)" checks.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.code == 'true'
      # Anti-drift gate: fail if the storage manifest is out of sync with the
      # tests that actually touch storage. The manifest drives both the storage
      # legs' `include` and the base leg's `exclude`, so a stale manifest would
      # either skip a storage test or run it in the wrong (provider-less) leg.
      - run: pnpm test:api:verify-storage-manifest
        if: needs.changes.outputs.code == 'true'
      - name: Run tests
        if: needs.changes.outputs.code == 'true'
        # Runs one Vitest project and emits a blob report (coverage embedded).
        # LEG is passed via env (never interpolate matrix values into `run:`
        # directly — that is a template-injection finding for zizmor); the blob
        # filename embeds LEG so the three legs never collide in the coverage job.
        env:
          LEG: ${{ matrix.leg }}
        run: pnpm test:api:leg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: blob-report-${{ matrix.leg }}
          path: apps/api/.vitest-reports/
          # `.vitest-reports` is a dotfile dir; without this, upload-artifact
          # (default include-hidden-files: false) skips its contents and the
          # coverage job's download finds nothing.
          include-hidden-files: true
          retention-days: 7

  # Enforces the apps/api coverage gate. Unlike the other heavy jobs, this one
  # `needs: test` because it consumes the three legs' blob reports — the legs
  # partition the suite, so coverage must be merged across them before any
  # threshold means anything (a single leg never sees the whole codebase). Vitest
  # merges the blobs natively (`--merge-reports`) and applies the gate
  # (90% for lines, statements, functions, and branches, passed by flag in the
  # test:coverage:merge script); there is no external merge script. When a test
  # leg fails there is nothing to gate
  # and the PR is already blocked, so this job is simply skipped. On docs-only PRs
  # every step is gated off (like the other jobs) and the required "Coverage"
  # check still reports success.
  coverage:
    needs: [check-draft, changes, test]
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.code == 'true'
      # Pull every leg's blob report into ONE flat dir. `merge-multiple: true` is
      # required: `vitest --merge-reports` reads the dir non-recursively and
      # rejects subfolders. Each leg's blob is uniquely named (blob-<leg>.json)
      # so they never collide.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          pattern: blob-report-*
          path: apps/api/.vitest-reports
          merge-multiple: true
      # Native Vitest merge + coverage + gate (90% all metrics, replaces check-coverage.mjs).
      - run: pnpm test:api:coverage:merge
        if: needs.changes.outputs.code == 'true'
      # Upload the human-readable merged report (html + lcov + json) this step
      # already produces. `always()` so it is available precisely when the gate
      # FAILS — that is when a contributor most needs to see which lines are
      # missing, without having to fetch and merge the three opaque blobs by hand.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: coverage-report-merged
          path: apps/api/coverage/
          retention-days: 7

  build:
    needs: [check-draft, changes]
    name: Build
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.code == 'true'
      - run: pnpm build
        if: needs.changes.outputs.code == 'true'

  # apps/web unit/integration tests (Vitest + jsdom + React Testing Library).
  # Separate from the `test` matrix above, which is apps/api-only (Testcontainers
  # + the storage-provider legs). The web suite needs no containers, so it is a
  # single fast leg. Gated on `code` like the other heavy jobs so docs-only PRs
  # still report a fast-success "Test (web)" check.
  test-web:
    needs: [check-draft, changes]
    name: Test (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.code == 'true'
      # `pnpm test:web` = `turbo run test --filter=web`; the turbo `test` task's
      # `dependsOn: ["^build"]` builds the workspace deps (@repo/*) to dist first
      # so Vitest resolves them the same way the app does (their `exports` point
      # at ./dist). A bare `pnpm --filter=web test` would skip that and fail to
      # resolve @repo/* on a clean checkout.
      - run: pnpm test:web
        if: needs.changes.outputs.code == 'true'

  # Boot the *assembled* production images and assert they actually serve traffic.
  #
  # WHY THIS EXISTS — nothing else in CI executes the shipped artifact. `build`
  # runs `pnpm build` over the source tree; `test` / `test-web` run Vitest against
  # source, resolving @repo/* and path aliases through vite-tsconfig-paths. The
  # image runs `node dist/server.js`: plain Node ESM resolution over tsc-emitted,
  # tsc-alias-rewritten output. Those are different resolvers over different
  # files, so a module that resolves in every existing job can still be absent
  # from the image. #555 (api runtime image cut down to a --prod dependency tree)
  # made that failure mode reachable and shipped on package-count evidence alone.
  # @fastify/autoload compounds it: plugins and routes are imported dynamically at
  # createApp() time by globbing the filesystem, so most of the import graph is
  # only resolved by actually booting.
  #
  # Deliberately NOT in trivy.yml, which already builds both images: that workflow
  # is advisory-by-design (see its header — path-filtered and occasionally flaky
  # on vuln-DB downloads), so a functional gate there could never be a required
  # check. These follow this file's deadlock-safe pattern instead: the jobs always
  # run and gate every step on `code`.
  #
  # SCOPE — a boot probe, not end-to-end coverage. It proves the process starts,
  # the module graph resolves, and the entry route answers. It does not exercise
  # business logic, auth, or storage round-trips, and it cannot see a *partial*
  # autoload failure: if one route file went missing from dist, autoload would
  # register fewer routes and /health would still return 200.
  smoke-api:
    needs: [check-draft, changes]
    name: Image Smoke (api)
    runs-on: ubuntu-latest
    services:
      # The api refuses to finish booting without a reachable database: the prisma
      # plugin's onReady hook runs `$connect()` then `SELECT 1` and rethrows on
      # failure, by design (apps/api/src/plugins/app/prisma.ts). `SELECT 1` touches
      # no table, so an empty database is enough — no migrations, no seed. That
      # round-trip is also the point: it exercises the generated Prisma client and
      # the pg adapter, the artifacts that span the builder -> prod-deps stage seam
      # where `dist` and `node_modules` come from two separate installs.
      #
      # Digest-pinned to the same image as docker-compose.yml and the Testcontainers
      # suite (apps/api/test/setup/testDatabase.ts) — bump all three together.
      # Dependabot does not track service-container images in workflows.
      #
      # Service containers start even when the steps below no-op on a docs-only
      # PR. A few seconds of wasted Postgres is the price of keeping this a
      # required-check-safe job rather than a job-level `if:`.
      postgres:
        image: postgres:18.4-alpine@sha256:1b1689b20d16a014a3d195653381cf2caa75a41a92d93b255a9d6ea29fd353aa
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      # No build args: the api image takes none (same as trivy.yml's matrix).
      - name: Build the api image
        if: needs.changes.outputs.code == 'true'
        run: docker build -f apps/api/Dockerfile -t api-smoke:ci .

      - name: Boot the image and probe /health
        if: needs.changes.outputs.code == 'true'
        env:
          # The minimum env that reaches a listening state, i.e. every fail-closed
          # guard in apps/api/src/config/environment.ts that fires when
          # NODE_ENV=production. Values are placeholders; nothing here is dialled.
          #
          # ALLOWED_ORIGIN is the one guard with no conditional: production always
          # requires it, or CORS would reflect any origin. AUTH_PROVIDER is left
          # unset on purpose -> "none", which keeps the production JWKS guards from
          # firing without needing a live IdP; the module graph is identical either
          # way, because jwt.ts -> jwksConfig.js -> jwks-rsa is a chain of *static*
          # imports that Node resolves at load time regardless of the runtime
          # branch. CHATBOT_ENABLED unset -> false, which is what keeps the
          # COOKIE_SECRET, LLM_PROVIDER and AZURE_OPENAI_* guards quiet.
          #
          # STORAGE_PROVIDER and its MINIO_* vars are needed only because
          # buildStorageConfig() throws at import without them. Nothing connects:
          # storagePlugin builds a client from config, and prisma is the only
          # plugin with an onReady hook. MINIO_RELAY_ENABLED stays unset, so the
          # API_ORIGIN guard is unreachable.
          #
          # KEEP IN SYNC: adding a new unconditional production guard to
          # environment.ts means adding its variable here, or this job fails with
          # that guard's own error message — which is the intended feedback.
          DATABASE_URL: postgresql://smoke:smoke@localhost:5432/smoke
          ALLOWED_ORIGIN: https://web.smoke.invalid
          STORAGE_PROVIDER: minio
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: smoke
          MINIO_SECRET_KEY: smoke-secret
        run: |
          set -euo pipefail

          # --network host so the container reaches the postgres service on
          # localhost:5432. NODE_ENV=production is baked into the image, so the
          # app binds 0.0.0.0:8080.
          docker run -d --name api-smoke --network host \
            -e DATABASE_URL -e ALLOWED_ORIGIN -e STORAGE_PROVIDER \
            -e MINIO_ENDPOINT -e MINIO_ACCESS_KEY -e MINIO_SECRET_KEY \
            api-smoke:ci

          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 http://localhost:8080/health -o health.json; then
              ok=1
              break
            fi
            # A resolution failure (ERR_MODULE_NOT_FOUND, dangling pnpm symlink,
            # a missing @repo/* dist) kills the process immediately — fail fast
            # with logs instead of burning the full timeout.
            if [ -z "$(docker ps -q -f name=api-smoke -f status=running)" ]; then
              echo "::error::Container exited before it could serve /health."
              break
            fi
            sleep 2
          done

          if [ -z "$ok" ]; then
            echo "::error::api image did not serve a healthy /health within 60s."
            exit 1
          fi

          cat health.json
          echo
          # /health answers 503 with database:"disconnected" when the Prisma
          # round-trip fails, which `curl -f` already rejected. Assert the body
          # explicitly anyway, so a future always-200 health route cannot silently
          # turn this gate into a bare TCP check.
          jq -e '.status == "ok" and .database == "connected"' health.json > /dev/null

      - name: Container logs
        if: failure() && needs.changes.outputs.code == 'true'
        run: docker logs api-smoke || true

  # The web image cannot have api's problem — its runner is nginx serving a static
  # bundle, with no Node runtime and no node_modules to go missing. It gets a smoke
  # test for a different, currently unguarded reason: apps/web/nginx.conf and
  # apps/web/security-headers.conf are validated by nothing at all in CI, and the
  # Dockerfile rewrites the latter with busybox `sed` at build time.
  smoke-web:
    needs: [check-draft, changes]
    name: Image Smoke (web)
    runs-on: ubuntu-latest
    env:
      # Distinct reserved-TLD hostnames (RFC 2606), one per placeholder, so the
      # assertions below can tell them apart. Passed with no path component: the
      # Dockerfile's origin() helper strips everything after scheme://host[:port],
      # and bare origins keep the expected value equal to the input.
      VITE_API_BASE_URL: https://api.smoke.invalid
      VITE_OIDC_ISSUER: https://idp.smoke.invalid
      STORAGE_ORIGIN: https://storage.smoke.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      - name: Build the web image
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          docker build -f apps/web/Dockerfile \
            --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
            --build-arg VITE_OIDC_ISSUER="$VITE_OIDC_ISSUER" \
            --build-arg STORAGE_ORIGIN="$STORAGE_ORIGIN" \
            -t web-smoke:ci .

      - name: Boot the image, probe / and verify the CSP
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail

          docker run -d --name web-smoke -p 8080:8080 web-smoke:ci

          ok=""
          for _ in $(seq 1 15); do
            if curl -fsS --max-time 5 -D headers.txt -o /dev/null http://localhost:8080/; then
              ok=1
              break
            fi
            # nginx refuses to start on an invalid directive, so an unparseable
            # conf shows up here rather than as a timeout.
            if [ -z "$(docker ps -q -f name=web-smoke -f status=running)" ]; then
              echo "::error::Container exited before it could serve the SPA (invalid nginx config?)."
              break
            fi
            sleep 2
          done

          if [ -z "$ok" ]; then
            echo "::error::web image did not serve / within 30s."
            exit 1
          fi

          csp="$(tr -d '\r' < headers.txt | grep -i '^content-security-policy:' || true)"
          if [ -z "$csp" ]; then
            echo "::error::No Content-Security-Policy header — the security-headers snippet was not applied."
            exit 1
          fi
          echo "$csp"

          # The Dockerfile substitutes __API_ORIGIN__ / __IDP_ORIGIN__ /
          # __STORAGE_ORIGIN__ into the CSP. A renamed or newly added placeholder
          # the sed does not cover ships as a literal token, which browsers treat
          # as a bogus source expression and drop — silently breaking every API,
          # IdP and storage call in production.
          if printf '%s\n' "$csp" | grep -qE '__[A-Z_]+__'; then
            echo "::error::Unsubstituted placeholder left in the CSP header."
            exit 1
          fi

          # And the inverse: substitution happened, with the right values. Guards
          # against an origin() regression that silently yields an empty string.
          for origin in "$VITE_API_BASE_URL" "$VITE_OIDC_ISSUER" "$STORAGE_ORIGIN"; do
            if ! printf '%s\n' "$csp" | grep -qF "$origin"; then
              echo "::error::CSP is missing a substituted origin: $origin"
              exit 1
            fi
          done

      - name: Container logs
        if: failure() && needs.changes.outputs.code == 'true'
        run: docker logs web-smoke || true

  audit:
    needs: check-draft
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # `pnpm audit` resolves the dependency graph from pnpm-lock.yaml, so no
      # install is needed. This also keeps the gate independent of the
      # minimumReleaseAge install check (which can transiently reject freshly
      # published, not-yet-aged lockfile entries).
      - run: pnpm audit --prod --audit-level moderate

  zizmor:
    needs: check-draft
    name: Zizmor (GitHub Actions security)
    runs-on: ubuntu-latest
    permissions:
      contents: read # required to check out the (private) repository
      actions: read # required by zizmor's online audits on a private repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          # Print findings to the log and fail the job on findings. Advanced
          # Security (SARIF upload to the security tab) is not used because this
          # repository is private and does not depend on that paid feature.
          advanced-security: false

  docs-links:
    needs: check-draft
    name: Docs Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for broken local links in Markdown docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Offline mode validates only local/relative file links — the class of
          # breakage that has bitten this repo (moved/renamed docs, wrong paths).
          # External URLs are skipped, so the gate is deterministic and never
          # flakes on network or rate limits. No GITHUB_TOKEN needed.
          args: "--offline --no-progress --exclude-path node_modules README.md 'docs/**/*.md' 'apps/**/README.md' 'packages/**/README.md'"
          fail: true

  secret-scan:
    needs: check-draft
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the scan covers every commit on the branch, not just
          # the tip — this is how the "0 findings" baseline was measured.
          fetch-depth: 0
      - name: Scan for secrets (betterleaks)
        # The betterleaks image is pinned by digest in .github/secret-scan/Dockerfile
        # rather than referenced inline here, so Dependabot's `docker` ecosystem keeps
        # it current automatically (Dependabot cannot see an image used in a `run:`
        # step). We build that single-FROM image and run it. betterleaks is the drop-in
        # successor to the now feature-frozen gitleaks and reads the repo's
        # .gitleaks.toml allowlist. `detect` scans the full git history and exits
        # non-zero on any finding that is not allowlisted.
        run: |
          docker build -t secret-scan .github/secret-scan
          docker run --rm -v "$PWD:/repo" -w /repo secret-scan \
            detect --source=. --config=.gitleaks.toml --redact --no-banner --exit-code=1
